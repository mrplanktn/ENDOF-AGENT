[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusagent"
version = "1.0.0"
description = "The Universal AI Agent Framework — one agent, every platform, every model, every tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "NexusAgent Contributors" }]
keywords = ["ai", "agent", "llm", "chatbot", "telegram", "discord", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-telegram-bot>=21.0",
    "discord.py>=2.3",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "html2text>=2024.2",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pydantic>=2.5",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
nexus = "cli.commands:main"

[tool.hatch.build.targets.wheel]
packages = [
    "gateway",
    "memory",
    "skills",
    "sessions",
    "cli",
    "config",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
